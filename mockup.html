<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget AI - UI Mockup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #343541;
      color: #ececf1;
      height: 100vh;
      display: flex;
    }
    .sidebar {
      width: 260px;
      background: #202123;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .app-name {
      font-weight: 600;
      font-size: 1rem;
    }
    .new-chat-btn {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: #ececf1;
      cursor: pointer;
      border-radius: 6px;
    }
    .new-chat-btn:hover {
      background: rgba(255,255,255,0.1);
    }
    .history-list {
      flex: 1;
      padding: 8px;
      overflow-y: auto;
      color: #8e8ea0;
      font-size: 0.85rem;
    }
    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .settings-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      background: none;
      border: none;
      color: #ececf1;
      cursor: pointer;
      transition: background 0.15s;
    }
    .settings-toggle:hover {
      background: rgba(255,255,255,0.1);
    }
    .settings-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .setting-item label {
      font-weight: 500;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
    }
    .setting-item textarea {
      width: 100%;
      background: #40414f;
      border: 1px solid #565869;
      border-radius: 6px;
      color: #ececf1;
      font-family: inherit;
      font-size: 0.8rem;
      padding: 6px 8px;
      resize: vertical;
      min-height: 60px;
    }
    .setting-item input[type="range"] {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #40414f;
      border-radius: 3px;
    }
    .setting-item input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #10a37f;
      cursor: pointer;
    }
    .theme-toggle {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: #ececf1;
      cursor: pointer;
      border-radius: 6px;
      align-self: flex-end;
    }
    .theme-toggle:hover {
      background: rgba(255,255,255,0.1);
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #343541;
    }
    .messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }
    .welcome {
      text-align: center;
      padding: 60px 20px;
    }
    .welcome-icon {
      font-size: 3rem;
      margin-bottom: 20px;
    }
    .welcome-heading {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
    .welcome-sub {
      color: #8e8ea0;
    }
    .input-bar {
      padding: 20px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    .input-field {
      flex: 1;
      background: #40414f;
      border: 1px solid #565869;
      border-radius: 18px;
      padding: 10px 14px;
      color: #ececf1;
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      min-height: 44px;
    }
    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #10a37f;
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .send-btn:hover {
      background: #0d8a6b;
    }
    .label-badge {
      background: rgba(16, 163, 127, 0.2);
      color: #10a37f;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="app-name">Budget AI</span>
      <button class="new-chat-btn">+</button>
    </div>
    
    <div class="history-list">
      No conversations yet.
    </div>
    
    <div class="sidebar-footer">
      <div class="settings-section">
        <button class="settings-toggle">
          ⚙️ <span>Settings</span>
        </button>
        <div class="settings-panel">
          <div class="setting-item">
            <label>
              System Prompt
              <span class="label-badge">NEW</span>
            </label>
            <textarea placeholder="You are a helpful assistant">You are a helpful assistant</textarea>
          </div>
          <div class="setting-item">
            <label>
              Max Tokens
              <span class="label-badge">NEW</span>
              <span>512</span>
            </label>
            <input type="range" min="64" max="2048" step="64" value="512">
          </div>
          <div class="setting-item">
            <label>
              Temperature
              <span class="label-badge">NEW</span>
              <span>0.7</span>
            </label>
            <input type="range" min="0" max="2" step="0.1" value="0.7">
          </div>
        </div>
      </div>
      
      <button class="theme-toggle">🌙</button>
    </div>
  </aside>
  
  <main class="main">
    <div class="messages">
      <div class="welcome">
        <div class="welcome-icon">💬</div>
        <h1 class="welcome-heading">Welcome to Budget AI</h1>
        <p class="welcome-sub">Ask me anything — I'll do my best to help.</p>
      </div>
    </div>
    
    <form class="input-bar">
      <textarea class="input-field" placeholder="Message Budget AI…" rows="1"></textarea>
      <button type="submit" class="send-btn">➤</button>
    </form>
  </main>
</body>
</html>
